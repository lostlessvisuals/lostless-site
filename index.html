  <script>
   document.addEventListener('DOMContentLoaded', function () {
        const gallery = document.querySelector('.gallery-grid');
        let originalOrder = [];
        let applyOrder = () => {};

        if (gallery) {
          const items = Array.from(gallery.children);
          const images = items.filter(item => item.querySelector('img'));
          const videos = items.filter(item => item.querySelector('video'));
          const mixedOrder = [];

          let imageIndex = 0;
          let videoIndex = 0;

          while (imageIndex < images.length || videoIndex < videos.length) {
            if (imageIndex < images.length) {
              mixedOrder.push(images[imageIndex]);
              imageIndex += 1;
            }
            if (videoIndex < videos.length) {
              mixedOrder.push(videos[videoIndex]);
              videoIndex += 1;
            }
          }

          originalOrder = mixedOrder.length ? mixedOrder : items;

          applyOrder = () => {
            if (!originalOrder.length) return;
            const fragment = document.createDocumentFragment();
            originalOrder.forEach(node => {
              fragment.appendChild(node);
            });
            gallery.appendChild(fragment);
          };

          applyOrder();

          let resizeTimer;
          window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(applyOrder, 150);
          });
        }

        document.querySelectorAll('.gallery-item').forEach(item => {
          item.addEventListener('click', () => {
            const media = item.querySelector('img, video');
            if (!media) return;
            const slug = media.getAttribute('alt') || media.getAttribute('src').split('/').pop().split('.')[0];
            if (window.plausible) {
              plausible('Lightbox Open', { props: { item: slug } });
            }
          });
        });
      });
  </script>
