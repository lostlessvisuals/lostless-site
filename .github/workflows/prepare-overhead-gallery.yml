name: Prepare Overhead gallery
on:
  push:
    branches: [overhead-gallery-20261011]
    paths: [.github/workflows/prepare-overhead-gallery.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply the verified eight-video gallery arrangement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = 'lostlessvisuals/lostless-site'
          branch = 'overhead-gallery-20261011'
          base = '060ad7b9319977e1ba4c6fd263bea4a224c4da56'
          api = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, payload=None):
              req = urllib.request.Request(api + path, headers=headers, data=None if payload is None else json.dumps(payload).encode(), method='GET' if payload is None else 'PUT')
              with urllib.request.urlopen(req, timeout=40) as response:
                  return json.load(response)
          with urllib.request.urlopen('https://raw.githubusercontent.com/' + repo + '/' + base + '/index.html', timeout=40) as response:
              original = response.read()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(original) == 'cf430b622c3a648105dfd507503280dabd3a6132'
          current = request('/contents/index.html?ref=' + branch)
          assert current['sha'] == '5d7b2b94eb94ab06abf7d87ddf1c4ac67c7c4ce7', 'Branch changed; refusing to overwrite it'
          text = original.decode('utf-8')
          section = re.search(r'<section class="gallery-grid grid">(.*?)</section>', text, re.S)
          assert section
          items = list(re.finditer(r'    <div class="gallery-item">.*?    </div>', section.group(1), re.S))
          assert len(items) == 119
          additions = [
              (0, 'overhead-scarlet-stairwell', 'Overhead endless red stairwell', 576, 1024, ['webm', 'mp4']),
              (14, 'overhead-echo-dancer', 'Overhead echo dancer', 576, 1024, ['mp4', 'webm']),
              (29, 'overhead-liquid-alloy', 'Overhead liquid silver and gold', 576, 1024, ['webm', 'mp4']),
              (46, 'overhead-ember-chrome', 'Overhead black chrome and red light', 576, 1024, ['webm', 'mp4']),
              (60, 'chromatic-rose-study', 'chromatic rose study', 576, 1024, ['webm', 'mp4']),
              (74, 'overhead-chrome-ribbons', 'Overhead floating chrome ribbons', 576, 1024, ['webm', 'mp4']),
              (88, 'overhead-tidal-filaments', 'Overhead teal and amber filaments', 576, 1024, ['webm', 'mp4']),
              (109, 'overhead-obsidian-cells', 'Overhead rippling obsidian cells', 1024, 576, ['webm', 'mp4']),
          ]
          blocks = []
          for position, slug, label, width, height, formats in reversed(additions):
              path = 'assets/media/' + slug
              markup = ('    <div class="gallery-item">\n'
                  f'     <video aria-label="Portfolio video: {label}" data-lazy="true" height="{height}" loop muted playsinline data-poster="{path}.jpg" preload="none" width="{width}">\n'
                  + ''.join(f'      <source data-src="{path}.{ext}" type="video/{ext}">\n' for ext in formats)
                  + '     </video>\n    </div>\n')
              offset = section.start(1) + items[position].start()
              text = text[:offset] + markup + text[offset:]
              blocks.append(markup)
          check = text
          for block in blocks:
              check = check.replace(block, '', 1)
          assert check.encode() == original, 'Existing content changed'
          assert blob_sha(text.encode()) == '3c093104d86e23edcbb6947de6e0c3a8e09897cb', 'Output differs from the locally checked version'
          result = request('/contents/index.html', {'message': 'Mix eight new optimized videos into the existing homepage gallery', 'branch': branch, 'sha': current['sha'], 'content': base64.b64encode(text.encode()).decode()})
          print('Updated feature branch only:', result['commit']['sha'])
          print('127 gallery items; original 119 preserved. Media assets still need uploading before merge.')
          PY
