name: Finalize eight-video gallery
on:
  push:
    branches: [overhead-gallery-20261011]
    paths: [.github/workflows/prepare-overhead-gallery.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overhead-gallery-20261011
          fetch-depth: 1
      - name: Include pastel flower clip without changing existing gallery items
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          path = pathlib.Path('index.html')
          data = path.read_bytes()
          assert blob_sha(data) == 'f1e06f478d8e3d33279d4ed152fd5715490df44a', 'Gallery changed; refusing to overwrite it'
          text = data.decode('utf-8')
          section = re.search(r'<section class="gallery-grid grid">(.*?)</section>', text, re.S)
          assert section
          items = list(re.finditer(r'    <div class="gallery-item">.*?    </div>', section.group(1), re.S))
          originals = [item for item in items if 'Portfolio video: Overhead ' not in item.group()]
          assert len(items) == 126 and len(originals) == 119
          markup = ('    <div class="gallery-item">\n'
              '     <video aria-label="Portfolio video: pastel flowers in bloom" data-lazy="true" height="1280" loop muted playsinline data-poster="assets/media/pastel-flowers.jpg" preload="none" width="720">\n'
              '      <source data-src="assets/media/pastel-flowers.webm" type="video/webm">\n'
              '      <source data-src="assets/media/pastel-flowers.mp4" type="video/mp4">\n'
              '     </video>\n    </div>\n')
          offset = section.start(1) + originals[6].start()
          result = (text[:offset] + markup + text[offset:]).encode('utf-8')
          assert blob_sha(result) == '5d7b2b94eb94ab06abf7d87ddf1c4ac67c7c4ce7', 'Unexpected gallery output'
          path.write_bytes(result)
          pathlib.Path('.github/workflows/prepare-overhead-gallery.yml').unlink()
          print('Eight additions; 119 original items preserved. Review branch only; media upload still required.')
          PY
      - name: Commit gallery and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/prepare-overhead-gallery.yml
          git commit -m 'Include pastel flower loop in eight-video gallery mix'
          git push origin HEAD:overhead-gallery-20261011
