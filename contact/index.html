<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>contact — lostless</title>
  <meta name="description" content="get in touch with lostless for bookings, commissions, or collaborations.">
  <meta name="author" content="lostless">
  <!--#include virtual="/includes/meta-social.html" -->
  <link rel="stylesheet" href="/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script defer data-domain="lostless.live" src="https://plausible.io/js/script.js"></script>
</head>
<body class="contact-page">

  <header>
    <nav>
      <a href="/" class="site-logo">
        <img src="/assets/meta/logo.png" alt="lostless logo" />
      </a>
      <ul>
        <li><a href="/">work</a></li>
        <li><a href="/highlights/">highlights</a></li>
        <li><a href="/about/">about</a></li>
        <li><a href="/contact/" class="active">contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="centered-section contact-section">
    <p class="contact-kicker">inquiries, bookings, commissions</p>

    <a href="mailto:lostless.visuals@gmail.com" class="contact-link contact-primary" onclick="plausible('Contact Email')">
      lostless.visuals@gmail.com
    </a>

    <p class="contact-note">or reach out here</p>

    <div class="contact-links" aria-label="social links">
      <a href="https://www.instagram.com/lostless.visuals/" target="_blank" rel="noopener noreferrer" class="contact-chip contact-chip-instagram" onclick="plausible('Instagram Click')">
        <img src="/assets/meta/instagram-icon.svg" alt="" aria-hidden="true" />
        instagram
      </a>
      <a href="https://www.linkedin.com/in/porter-769a97190/" target="_blank" rel="noopener noreferrer" class="contact-chip" onclick="plausible('LinkedIn Click')">
        linkedin
      </a>
      <a href="https://github.com/lostlessvisuals" target="_blank" rel="noopener noreferrer" class="contact-chip" onclick="plausible('GitHub Click')">
        github
      </a>
    </div>
  </main>

</body>
</html>
